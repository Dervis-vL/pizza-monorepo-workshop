[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "pizza-shared"
version = "0.1.0"
description = "Shared schemas and ports for the pizza workshop platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
]

[tool.deptry]
per_rule_ignores = { DEP003 = ["pizza_shared"] }

[tool.bumpversion]
current_version = "0.1.0"
commit          = true
tag             = true
tag_name        = "pizza-shared/v{new_version}"
tag_message     = "Release pizza-shared {new_version}"
message         = "chore(pizza-shared): bump {current_version} → {new_version}"
commit_args     = "--no-verify"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search   = 'version = "{current_version}"'
replace  = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search   = "## [Unreleased]"
replace  = "## [{new_version}] - {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "release_scope.env"
search   = "RELEASE=(patch|minor|major)"
replace  = "RELEASE=placeholder"
regex    = true
